server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Structured (JSON) access log — easy to ship to a log collector as-is.
    log_format json_combined escape=json
      '{"time":"$time_iso8601","remote_addr":"$remote_addr","request":"$request",'
      '"status":$status,"body_bytes_sent":$body_bytes_sent,"request_time":$request_time,'
      '"referer":"$http_referer","user_agent":"$http_user_agent"}';
    access_log /var/log/nginx/access.log json_combined;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Health endpoint for Docker HEALTHCHECK / orchestrator liveness probes.
    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    # Vite content-hashes filenames under /assets, so these are safe to
    # cache aggressively — a new build always ships new filenames.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback — required for React Router-style client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
